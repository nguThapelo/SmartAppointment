name: Scheduled jobs

# Amplify Hosting has no cron, so GitHub Actions (free) calls the app's
# secret-protected job endpoints. Configure in the repo's settings:
#   Secrets:   CRON_SECRET  (same value as the Amplify env var)
#   Variables: APP_URL      (e.g. https://main.xxxxxx.amplifyapp.com)

on:
  schedule:
    - cron: "17 * * * *" # hourly: payment reconcile
    - cron: "43 1 * * *" # daily 01:43 UTC: close completed + cleanup
  workflow_dispatch:
    inputs:
      job:
        description: Job to run
        required: true
        type: choice
        options: [reconcile-payments, close-completed, cleanup]

jobs:
  run:
    runs-on: ubuntu-latest
    if: ${{ vars.APP_URL != '' }}
    steps:
      - name: Pick jobs
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "jobs=${{ inputs.job }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "17 * * * *" ]; then
            echo "jobs=reconcile-payments" >> "$GITHUB_OUTPUT"
          else
            echo "jobs=close-completed cleanup" >> "$GITHUB_OUTPUT"
          fi
      - name: Call job endpoints
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          for job in ${{ steps.pick.outputs.jobs }}; do
            echo "→ $job"
            curl --fail-with-body -sS -X POST "$APP_URL/api/cron/$job" \
              -H "Authorization: Bearer $CRON_SECRET" --max-time 60
            echo
          done
